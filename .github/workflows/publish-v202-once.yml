# One-time owner-requested v2.0.2 release entry point; remove after completion.
name: Start v2.0.2 publication once
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-v202-once.yml']
permissions:
  contents: read
jobs:
  start:
    if: github.repository == 'ukr8b3g-cmyk/Anima_Regional_Canvas' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify source CI, create the new tag, and start the existing release workflow once
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          python - <<'PY'
          import base64, json, os, time, tomllib, urllib.error, urllib.request
          repo = 'ukr8b3g-cmyk/Anima_Regional_Canvas'
          base = 'https://api.github.com/repos/' + repo
          sha = os.environ['SOURCE_SHA']
          tag = 'v2.0.2'
          def api(path, method='GET', data=None, absent=False):
              request = urllib.request.Request(base + path,
                  data=None if data is None else json.dumps(data).encode(), method=method,
                  headers={'Authorization': 'Bearer ' + os.environ['GITHUB_TOKEN'],
                           'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json'})
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      payload = response.read()
                      return json.loads(payload) if payload else None
              except urllib.error.HTTPError as error:
                  if absent and error.code == 404:
                      return None
                  raise RuntimeError('GitHub API returned HTTP ' + str(error.code)) from None
          assert os.environ['GITHUB_REPOSITORY'] == repo
          assert api('/branches/main')['commit']['sha'] == sha, 'Main changed; inspect before releasing'
          metadata = api('/contents/pyproject.toml?ref=' + sha)
          assert tomllib.loads(base64.b64decode(metadata['content']).decode())['project']['version'] == '2.0.2'
          assert api('/releases/tags/' + tag, absent=True) is None, 'Release already exists; do not recreate it'
          assert api('/git/ref/tags/' + tag, absent=True) is None, 'Tag already exists; inspect before retrying'
          required = {'Regression checks', 'Registry publication configuration checks'}
          for attempt in range(36):
              runs = api('/actions/runs?head_sha=' + sha + '&per_page=100')['workflow_runs']
              selected = {name: [run for run in runs if run['name'] == name and run['event'] == 'push'
                          and run['head_sha'] == sha and run['head_repository']['full_name'] == repo]
                          for name in required}
              failed = [name for name, matching in selected.items() if matching and matching[0]['status'] == 'completed'
                        and matching[0]['conclusion'] != 'success']
              assert not failed, 'Source CI failed: ' + ', '.join(failed)
              if all(matching and matching[0]['conclusion'] == 'success' for matching in selected.values()):
                  break
              if attempt == 35:
                  raise RuntimeError('Source CI has not completed; no tag or release created')
              time.sleep(10)
          assert api('/branches/main')['commit']['sha'] == sha, 'Main changed; inspect before releasing'
          api('/git/refs', 'POST', {'ref': 'refs/tags/' + tag, 'sha': sha})
          # workflow_dispatch is explicitly permitted to trigger a workflow with GITHUB_TOKEN.
          api('/actions/workflows/release.yml/dispatches', 'POST',
              {'ref': 'main', 'inputs': {'release_tag': tag}})
          print('Created ' + tag + ' at ' + sha + ' and dispatched the existing release workflow once.')
          PY
